// Published by the members module. Consumers load the class named by the __TypeId__
// header, so java_package and message names are on the wire like field numbers.

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.ecclesiaflow.grpc.events.members";
option java_outer_classname = "MembersDomainEventsProto";

package ecclesiaflow.events.members.v1;

// Domain events emitted by members-module onto the cross-module topic exchange
// "ecclesiaflow.domain-events". Consumers (e.g. church-module) bind queues to
// the relevant routing keys and react. Mirrors church_events.proto for options,
// package conventions and field layout (event_id + occurred_at_epoch_ms first).
// See ecclesiaflow-deploy/docs/adr/0001-domain-events-cross-module-via-rabbitmq.md.

// The member's answer to the baptism question. A three-valued enum rather than
// a bool, because "has not been asked yet" is a real and durable state that a
// bool cannot express: proto3 bools have no presence, so an absent field would
// arrive as false and a consumer would render a legacy member as "pas baptisé" —
// asserting something about that person that they never said.
//
// UNSPECIFIED is the zero value on purpose: an old producer that does not set
// the field, or a member who predates the question, both degrade to "pas encore
// renseigné", which is the only honest reading of silence.
enum BaptismDeclaration {
  // Not yet declared: the member has never answered. Legacy rows and members
  // provisioned by a pastor. Consumers MUST render this distinctly from
  // NOT_BAPTISED — that distinction is the whole point of this enum.
  BAPTISM_DECLARATION_UNSPECIFIED = 0;

  // The member declared they have NOT been baptised. baptism_date, baptism_type
  // and baptism_type_label are all EMPTY, and that emptiness is meaningful.
  BAPTISM_DECLARATION_NOT_BAPTISED = 1;

  // The member declared they HAVE been baptised. baptism_date and baptism_type
  // are both populated.
  BAPTISM_DECLARATION_BAPTISED = 2;
}

// Emitted right after a member's profile changes in a way other modules care
// about: a first/last name change (PATCH profile), a confirmed email change, a
// change to the declared baptism, or a change to the phone-sharing consent.
// The snapshot carries the FULL post-change profile so a consumer can refresh
// its denormalized copy without a round-trip. Idempotent on event_id.
// Routing key: "members.profile.changed".
message MemberProfileChangedEvent {
  // UUIDv4. Consumers dedupe on this to make their handler idempotent.
  string event_id = 1;

  // Milliseconds since Unix epoch (UTC).
  int64 occurred_at_epoch_ms = 2;

  // The member's Keycloak sub — the cross-module key (== members.keycloak_user_id).
  string keycloak_user_id = 3;

  // The member's first name, post-change.
  string first_name = 4;

  // The member's last name, post-change.
  string last_name = 5;

  // The member's email, post-change.
  string email = 6;

  // The member's baptism date as ISO-8601 "YYYY-MM-DD", post-change. EMPTY
  // unless baptism_declared == BAPTISED. A plain string (not a timestamp)
  // because a baptism is a calendar day: an instant would render as the previous
  // day for consumers east or west of the emitting timezone.
  string baptism_date = 7;

  // The member's baptism rite, post-change: one of IMMERSION, ASPERSION,
  // AFFUSION, INFANT, OTHER. EMPTY when the member declared no type. Carried as
  // a string rather than a proto enum so adding a rite never breaks a consumer
  // built against an older descriptor — an unknown value degrades to "show the
  // raw label", not to a deserialization failure.
  string baptism_type = 8;

  // Free-text rite name, set IFF baptism_type == "OTHER"; EMPTY otherwise.
  string baptism_type_label = 9;

  // Whether the member consents to their phone number being shared with their
  // church. proto3 bools have no presence, so an absent field reads as false —
  // which is the privacy-preserving value, meaning a consumer that misses this
  // field fails CLOSED rather than leaking. Note this is only a signal for the
  // consumer's UI: the number itself is filtered at the source, so a
  // non-consenting member's phone is never returned by GetMemberContacts.
  bool phone_shared_with_church = 10;

  // The member's answer to the baptism question, post-change. This is what lets
  // a pastor's directory tell "pas baptisé" from "pas encore renseigné" — the
  // three baptism_* strings above are EMPTY in both cases, so they cannot carry
  // the distinction on their own.
  BaptismDeclaration baptism_declared = 11;
}

// Emitted once a member has been anonymized at the end of the deactivation
// grace period: their PII is scrubbed and their Keycloak user is deleted, so
// the person no longer exists on the platform. A consumer that holds a copy of
// the member's identity (e.g. the church module's finance context) severs it.
//
// Deliberately carries NO profile data — no name, email, phone or address —
// because the point of the event is that this data is gone. keycloak_user_id
// is the cross-module key a consumer needs to find its own rows; nothing else
// about the person is disclosed. MemberAnonymizedEventTest pins the field set.
//
// Idempotent on event_id, which is DETERMINISTIC ("anon:<member_id>") rather
// than random: the members module re-emits the event until a publish has been
// acknowledged (outbox-lite), so a consumer may see the same event more than
// once and must collapse duplicates on event_id.
// Routing key: "members.profile.anonymized".
message MemberAnonymizedEvent {
  // Deterministic: "anon:" + the members-module member_id (UUID). Re-emits of
  // the same anonymization carry the same id so idempotent consumers collapse
  // them.
  string event_id = 1;

  // Milliseconds since Unix epoch (UTC) at which the member was anonymized.
  // Stable across re-emits of the same anonymization.
  int64 occurred_at_epoch_ms = 2;

  // The former member's Keycloak sub — the cross-module key (== the
  // members.keycloak_user_id the row carried before anonymization). The
  // Keycloak user is already deleted when this event is emitted.
  string keycloak_user_id = 3;
}

// Emitted with MemberAnonymizedEvent, in the same transaction and under the
// same ordering key, for the module that finds a person by address rather
// than by key: communication keeps sent mail and campaign recipients by
// address only, so the Keycloak sub alone cannot reach them.
//
// The addresses travel as digests, never in clear: each entry is the
// RecipientDigest of an address the member held at erasure, the SHA-256 of
// the address as the platform writes it (trimmed, lowercased; a phone number
// as "+" and its digits), in lowercase hex. A module that still holds the
// address recognises it; any other reader learns nothing it could read back.
// MemberContactsErasedEventTest pins the field set.
//
// Idempotent on event_id, which is DETERMINISTIC ("contacts:<member_id>") for
// the same reason as MemberAnonymizedEvent's: an anonymization announced again
// carries the same id, and its consumer collapses it.
// Routing key: "members.contacts.erased".
message MemberContactsErasedEvent {
  // Deterministic: "contacts:" + the members-module member_id (UUID).
  string event_id = 1;

  // Milliseconds since Unix epoch (UTC) at which the member was anonymized;
  // the same instant as the MemberAnonymizedEvent staged with it.
  int64 occurred_at_epoch_ms = 2;

  // The former member's Keycloak sub, for what a consumer keeps by user id.
  string keycloak_user_id = 3;

  // One RecipientDigest per address the member held: the emails, then the
  // phone number. Empty when none survived to the erasure (an anonymization
  // announced again after its addresses were scrubbed); the consumer still
  // acts on keycloak_user_id.
  repeated string recipient_digests = 4;
}

// Emitted when a member deactivates their account, which opens the grace
// period before anonymization: the modules that show the person to others
// (directory, groups, chat, campaigns) hide them at once instead of waiting
// for the erasure. Carries the key and the address digests (RecipientDigest,
// as on MemberContactsErasedEvent) because communication finds a recipient by
// address only. A redelivered event can arrive after a later reactivation, so
// a consumer keeps the latest occurred_at_epoch_ms per user and ignores an
// older event. Idempotent on event_id.
// Routing key: "members.account.deactivated".
message MemberDeactivatedEvent {
  // UUIDv4. Consumers dedupe on this to make their handler idempotent.
  string event_id = 1;

  // Milliseconds since Unix epoch (UTC) at which the account was deactivated.
  int64 occurred_at_epoch_ms = 2;

  // The member's Keycloak sub, the cross-module key.
  string keycloak_user_id = 3;

  // One RecipientDigest per address the member holds: the email, then the
  // phone number when there is one.
  repeated string recipient_digests = 4;
}

// Emitted when a member reactivates their account within the grace period:
// what MemberDeactivatedEvent hid is shown again. Same fields and ordering
// rule as MemberDeactivatedEvent. Idempotent on event_id.
// Routing key: "members.account.reactivated".
message MemberReactivatedEvent {
  // UUIDv4. Consumers dedupe on this to make their handler idempotent.
  string event_id = 1;

  // Milliseconds since Unix epoch (UTC) at which the account was reactivated.
  int64 occurred_at_epoch_ms = 2;

  // The member's Keycloak sub, the cross-module key.
  string keycloak_user_id = 3;

  // One RecipientDigest per address the member holds: the email, then the
  // phone number when there is one.
  repeated string recipient_digests = 4;
}
