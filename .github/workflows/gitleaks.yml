name: gitleaks
# Secret-scanning backstop: blocks a push/PR if a credential is committed,
# even if .gitignore misses a file. Added after a .env.bak leak (S2S secret).
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so historical secrets are caught too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
