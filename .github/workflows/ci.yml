name: Platform Core CI

# main is verified by snapshot.yml before it publishes; this covers the branches and PRs that lead to it.
on:
  push:
    branches:
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push makes the running verify of the same ref worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & verify
        run: mvn -B verify
