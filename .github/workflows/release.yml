name: Release to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave empty to use the tag.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # actions/setup-java injects ~/.m2/settings.xml with credentials
          # for the server id we declare here.
          server-id: github
          server-username: GITHUB_USER
          server-password: GITHUB_TOKEN

      - name: Resolve target version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[release] Publishing version: $VERSION"

      - name: Read version from pom
        id: pom
        run: |
          POM_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "[release] pom version: $POM_VERSION"

      # A tag must sit on the commit that sets the pom to its version: built from a SNAPSHOT pom,
      # the published jar differs from what checking out the tag builds.
      - name: Refuse a SNAPSHOT or mismatched version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          POM_VERSION: ${{ steps.pom.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version (X.Y.Z). SNAPSHOTs are published by snapshot.yml."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::tag v$VERSION is on a commit whose pom declares '$POM_VERSION'. Set the pom to $VERSION, commit, and tag that commit."
            exit 1
          fi

      - name: Set Maven project version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: mvn -B versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Build & verify
        run: mvn -B verify

      - name: Publish to GitHub Packages
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -DskipTests deploy
