name: Publish SNAPSHOT to GitHub Packages

# Every push to main publishes the version declared in pom.xml as a SNAPSHOT
# to GitHub Packages so downstream consumers' dev branches can resolve the
# latest integrated state of the library.
#
# Stable releases are handled separately by release.yml (tag-triggered).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_USER
          server-password: GITHUB_TOKEN

      - name: Read version from pom
        id: ver
        run: |
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[snapshot] pom version: $VERSION"

      - name: Refuse non-SNAPSHOT versions
        if: ${{ !endsWith(steps.ver.outputs.version, '-SNAPSHOT') }}
        run: |
          echo "::error::pom version '${{ steps.ver.outputs.version }}' is not a -SNAPSHOT. Use release.yml + a v*.*.* tag for releases."
          exit 1

      - name: Build & verify
        run: mvn -B verify

      - name: Publish SNAPSHOT to GitHub Packages
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -DskipTests deploy
